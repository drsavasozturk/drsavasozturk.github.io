<svg viewBox="0 0 600 282" style="width:100%;height:auto;max-height:256px" role="img" aria-label="APOL1 risk varyantlarının evrimsel kökeni ve böbrek riski">
          <rect x="0" y="0" width="600" height="282" fill="#f7fbfd" stroke="#dbe4ec" rx="10"/>
          <rect x="10" y="8" width="580" height="66" rx="9" fill="#e7f7ee" stroke="#1f8a4c" stroke-width="2"/>
          <text x="24" y="28" font-size="14" font-weight="800" fill="#0f4d2c">Evrimsel avantaj</text>
          <text x="24" y="47" font-size="13" fill="#0f4d2c">G1 ve G2 varyantları <tspan font-weight="700">Trypanosoma brucei</tspan> enfeksiyonuna karşı korur</text>
          <text x="24" y="65" font-size="13" fill="#0f4d2c">(Afrika uyku hastalığı) → Afrika kökenli popülasyonlarda yaygınlaştı</text>
          <path d="M300 74 L300 86" stroke="#4a5b6b" stroke-width="2.5"/><path d="M300 90 l-6 -10 l12 0 z" fill="#4a5b6b"/>
          <rect x="10" y="92" width="580" height="50" rx="9" fill="#e8f6ff" stroke="#0b6e99" stroke-width="2"/>
          <text x="24" y="112" font-size="14" font-weight="800" fill="#0d3a52">Orak hücre – sıtma benzetmesi</text>
          <text x="24" y="132" font-size="13" fill="#0d3a52">Enfeksiyona karşı koruyan varyant, taşıyıcısına başka bir hastalık riski getirir</text>
          <path d="M300 142 L300 154" stroke="#c0392b" stroke-width="2.5"/><path d="M300 158 l-6 -10 l12 0 z" fill="#c0392b"/>
          <rect x="10" y="160" width="580" height="114" rx="9" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
          <text x="24" y="180" font-size="14" font-weight="800" fill="#8e2a1e">Böbrekteki bedel — resesif model, iki risk aleli</text>
          <text x="24" y="199" font-size="13" fill="#722018">FSGS için olasılık oranı <tspan font-weight="700">17 kat</tspan> (%95 GA 11–26)</text>
          <text x="24" y="216" font-size="13" fill="#722018">HIV ilişkili nefropati için <tspan font-weight="700">29 kat</tspan> (%95 GA 13–68)</text>
          <text x="24" y="235" font-size="13" fill="#722018">İki risk aleli taşıyan kişide yaşam boyu FSGS riski <tspan font-weight="700">~%4</tspan>;</text>
          <text x="24" y="252" font-size="13" fill="#722018">tedavisiz HIV enfeksiyonunda HIVAN riski <tspan font-weight="700">~%50</tspan></text>
          <text x="24" y="268" font-size="13" fill="#8e2a1e" font-weight="700">Risk alelleri yalnızca Afrika kökenli kromozomlarda bulunur</text>
        </svg>