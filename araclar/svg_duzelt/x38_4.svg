<svg viewBox="0 0 1120 250" style="width:100%;height:auto;max-height:242px" role="img" aria-label="Uc damar erisim tipi semasi">
      <rect x="12" y="12" width="352" height="226" rx="12" fill="#e8f6ef" stroke="#1f8a4c" stroke-width="2.2"/>
      <text x="188" y="40" font-size="15" font-weight="800" fill="#12603a" text-anchor="middle">ARTERİYOVENÖZ FİSTÜL</text>
      <text x="188" y="60" font-size="12" fill="#6b7b8a" text-anchor="middle">Hastanın kendi atardamarı + kendi toplardamarı</text>
      <line x1="60" y1="108" x2="316" y2="108" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
      <path d="M150 108 C185 70 240 76 300 88" fill="none" stroke="#2b6cb0" stroke-width="9" stroke-linecap="round"/>
      <circle cx="150" cy="108" r="8" fill="#1f8a4c"/>
      <text x="150" y="136" font-size="11.5" fill="#12603a" text-anchor="middle">anastomoz</text>
      <text x="188" y="172" font-size="12.5" font-weight="700" fill="#1f8a4c" text-anchor="middle">En uzun ömürlü · en az enfeksiyon</text>
      <text x="188" y="194" font-size="12" fill="#c0392b" text-anchor="middle">En uzun olgunlaşma · en yüksek primer yetmezlik</text>
      <text x="188" y="220" font-size="12" fill="#3d4d5c" text-anchor="middle">Kullanıma hazır: haftalar–aylar</text>

      <rect x="384" y="12" width="352" height="226" rx="12" fill="#fff6e5" stroke="#c98a00" stroke-width="2.2"/>
      <text x="560" y="40" font-size="15" font-weight="800" fill="#8a6000" text-anchor="middle">ARTERİYOVENÖZ GREFT</text>
      <text x="560" y="60" font-size="12" fill="#6b7b8a" text-anchor="middle">Sentetik tüp (genellikle PTFE) köprü kurar</text>
      <line x1="430" y1="108" x2="690" y2="108" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
      <path d="M470 108 C500 58 620 58 655 96" fill="none" stroke="#c98a00" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 0"/>
      <path d="M655 96 C672 104 682 106 690 108" fill="none" stroke="#2b6cb0" stroke-width="9" stroke-linecap="round"/>
      <text x="560" y="150" font-size="11.5" fill="#8a6000" text-anchor="middle">venöz anastomoz = darlığın klasik yeri</text>
      <text x="560" y="176" font-size="12.5" font-weight="700" fill="#c98a00" text-anchor="middle">Hızlı kullanılabilir · damarı zayıf hastada seçenek</text>
      <text x="560" y="198" font-size="12" fill="#c0392b" text-anchor="middle">Daha çok girişim · daha çok tromboz ve enfeksiyon</text>
      <text x="560" y="222" font-size="12" fill="#3d4d5c" text-anchor="middle">Kullanıma hazır: 2–4 hafta (erken kanülasyonda günler)</text>

      <rect x="756" y="12" width="352" height="226" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2.2"/>
      <text x="932" y="40" font-size="15" font-weight="800" fill="#7b1f14" text-anchor="middle">SANTRAL VENÖZ KATETER</text>
      <text x="932" y="60" font-size="12" fill="#6b7b8a" text-anchor="middle">Tünelli, kaflı — tercihen sağ internal juguler</text>
      <path d="M790 128 L852 106 L996 88" fill="none" stroke="#6a4c93" stroke-width="9" stroke-linecap="round"/>
      <circle cx="996" cy="88" r="7" fill="#6a4c93"/>
      <text x="1010" y="92" font-size="11.5" fill="#6a4c93">uç: sağ atriyum</text>
      <text x="932" y="150" font-size="12.5" font-weight="700" fill="#1f8a4c" text-anchor="middle">Hemen kullanılır · iğne gerektirmez</text>
      <text x="932" y="176" font-size="12.5" font-weight="800" fill="#c0392b" text-anchor="middle">En yüksek enfeksiyon ve ölüm ilişkisi</text>
      <text x="932" y="200" font-size="12" fill="#c0392b" text-anchor="middle">Santral ven darlığı → kolu kalıcı olarak kaybettirir</text>
      <text x="932" y="222" font-size="12" fill="#3d4d5c" text-anchor="middle">Kullanıma hazır: aynı gün</text>
    </svg>